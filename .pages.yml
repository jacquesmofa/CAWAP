# GENERATED by scripts/cms-config.mjs from src/content/*.json — do not edit by hand.
# Run "npm run cms:config" after adding content files or fields.
# Pages CMS (https://app.pagescms.org): editor for people without a GitHub account.
media:
  input: "public/media/uploads"
  output: "/media/uploads"
  rename: "safe"
  categories:
    - "image"
    - "document"
settings:
  commit:
    identity: "user"
content:
  - name: "events"
    label: "Events & flyers"
    type: "file"
    path: "src/content/events.json"
    format: "json"
    description: "Future dates appear under Upcoming Events automatically; past dates move to Past Events."
    fields:
      - name: "items"
        label: "Events"
        type: "object"
        list: true
        fields:
          - name: "id"
            label: "Short ID"
            description: "Lowercase words joined by dashes, unique, e.g. summer-camp-2027. Never change it after publishing."
            type: "string"
          - name: "title"
            label: "Title"
            type: "string"
          - name: "imageUrl"
            label: "Flyer image"
            description: "Portrait flyer (JPG or PNG), under 2 MB."
            type: "image"
          - name: "date"
            label: "Date"
            type: "date"
          - name: "description"
            label: "Description"
            type: "text"
          - name: "eventLink"
            label: "Related page on this site"
            description: "Optional, e.g. /contact or /cultural-events"
            type: "string"
          - name: "registrationLink"
            label: "Registration link"
            description: "A Google Form or other full https:// link, or a page like /contact. Leave empty if none."
            type: "string"
          - name: "time"
            label: "Time"
            description: "e.g. 11:00 AM - 2:00 PM"
            type: "string"
          - name: "location"
            label: "Location"
            type: "string"
          - name: "cost"
            label: "Cost"
            description: "e.g. FREE (Registration Required)"
            type: "string"
          - name: "hosts"
            label: "Hosts / speakers"
            type: "object"
            list: true
            fields:
              - name: "name"
                label: "Name"
                type: "string"
              - name: "title"
                label: "Title"
                type: "text"
          - name: "whoShouldAttend"
            label: "Who should attend"
            type: "string"
            list: true
          - name: "whatYouWillLearn"
            label: "What you will learn"
            type: "string"
            list: true
          - name: "bonuses"
            label: "Bonuses for attendees"
            type: "string"
            list: true
          - name: "contactEmail"
            label: "Contact email"
            type: "string"
          - name: "contactPhone"
            label: "Contact phone"
            type: "string"
