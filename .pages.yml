        label: "Organization name"
        type: "string"
      - name: "tagline"
        label: "Tagline (under the name)"
        type: "string"
      - name: "contact"
        label: "Contact"
        type: "object"
        fields:
          - name: "phoneDisplay"
            label: "Phone (as shown)"
            description: "e.g. 647-581-5901"
            type: "string"
          - name: "phoneLink"
            label: "Phone (for tap-to-call)"
            description: "International format without spaces, e.g. +16475815901"
            type: "string"
          - name: "email"
            label: "Email"
            type: "string"
          - name: "addressLine1"
            label: "Address line 1"
            type: "string"
          - name: "addressLine2"
            label: "Address line 2"
