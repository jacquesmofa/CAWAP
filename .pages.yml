# GENERATED by scripts/cms-config.mjs from src/content/*.json — do not edit by hand.
# Run "npm run cms:config" after adding content files or fields.
# Pages CMS (https://app.pagescms.org): editor for people without a GitHub account.
media:
  input: "public/media/uploads"
  output: "/media/uploads"
  rename: "safe"
  categories:
    - "image"
    - "document"
settings:
  commit:
    identity: "user"
content:
  - name: "site"
    label: "Contact details & social links"
    type: "file"
    path: "src/content/site.json"
    format: "json"
    fields:
      - name: "brandName"
        label: "Organization name"
        type: "string"
      - name: "tagline"
        label: "Tagline (under the name)"
        type: "string"
      - name: "contact"
        label: "Contact"
        type: "object"
        fields:
          - name: "phoneDisplay"
            label: "Phone (as shown)"
            description: "e.g. 647-581-5901"
            type: "string"
          - name: "phoneLink"
            label: "Phone (for tap-to-call)"
            description: "International format without spaces, e.g. +16475815901"
            type: "string"
          - name: "email"
            label: "Email"
            type: "string"
          - name: "addressLine1"
            label: "Address line 1"
            type: "string"
          - name: "addressLine2"
            label: "Address line 2"
            type: "string"
      - name: "socials"
        label: "Social media links"
        type: "object"
        list: true
        fields:
          - name: "name"
            label: "Name"
            type: "string"
          - name: "url"
            label: "Link (full https:// address)"
            type: "string"
          - name: "icon"
            label: "Icon"
            description: "Icon name, e.g. fas fa-users (fontawesome.com) or ri-heart-pulse-line (remixicon.com)."
            type: "string"
  - name: "navigation"
    label: "Main menu"
    type: "file"
    path: "src/content/navigation.json"
    format: "json"
    fields:
      - name: "links"
        label: "Menu links"
