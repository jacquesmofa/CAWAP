# GENERATED by scripts/cms-config.mjs from src/content/*.json — do not edit by hand.
# Run "npm run cms:config" after adding content files or fields.
# Sveltia CMS at https://www.cawap.ca/admin/ — editor for people with a GitHub account.
# "Sign In with GitHub" runs on our own server: public/api/auth.php + callback.php.
# "Sign In Using Access Token": fine-grained token for jacquesmofa/CAWAP (Contents: read and write).
backend:
  name: "github"
  repo: "jacquesmofa/CAWAP"
  branch: "main"
  base_url: "https://www.cawap.ca"
  auth_endpoint: "api/auth.php"
media_folder: "public/media/uploads"
public_folder: "/media/uploads"
collections:
  - name: "events"
    label: "Events & trainings"
    files:
      - name: "events"
        label: "Events & flyers"
        file: "src/content/events.json"
        format: "json"
        description: "Future dates appear under Upcoming Events automatically; past dates move to Past Events."
        fields:
          - name: "items"
            label: "Events"
            required: false
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - name: "id"
                label: "Short ID"
                required: false
                hint: "Lowercase words joined by dashes, unique, e.g. summer-camp-2027. Never change it after publishing."
                widget: "string"
              - name: "title"
                label: "Title"
                required: false
                widget: "string"
              - name: "imageUrl"
                label: "Flyer image"
                required: false
                hint: "Portrait flyer (JPG or PNG), under 2 MB."
                widget: "image"
              - name: "date"
                label: "Date"
                required: false
                widget: "datetime"
                time_format: false
                date_format: "YYYY-MM-DD"
                format: "YYYY-MM-DD"
              - name: "description"
                label: "Description"
                required: false
                widget: "text"
              - name: "eventLink"
                label: "Related page on this site"
                required: false
                hint: "Optional, e.g. /contact or /cultural-events"
                widget: "string"
              - name: "registrationLink"
                label: "Registration link"
                required: false
                hint: "A Google Form or other full https:// link, or a page like /contact. Leave empty if none."
                widget: "string"
              - name: "time"
                label: "Time"
                required: false
                hint: "e.g. 11:00 AM - 2:00 PM"
                widget: "string"
              - name: "location"
                label: "Location"
                required: false
                widget: "string"
              - name: "cost"
                label: "Cost"
                required: false
                hint: "e.g. FREE (Registration Required)"
                widget: "string"
              - name: "hosts"
                label: "Hosts / speakers"
                required: false
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - name: "name"
                    label: "Name"
                    required: false
                    widget: "string"
                  - name: "title"
                    label: "Title"
                    required: false
                    widget: "text"
              - name: "whoShouldAttend"
